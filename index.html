<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>情绪菜园</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#3b6cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="情绪菜园">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1d2433;--sub:#6b7488;--pri:#3b6cf6;--line:#e3e8f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding:16px 16px 40px}
.prog{display:flex;gap:6px;margin-bottom:14px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--pri)}
h1{font-size:20px;margin:4px 0 4px}
h2{font-size:22px;margin:2px 0}
.hint{color:var(--sub);font-size:13px;margin-bottom:14px;line-height:1.5}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(30,50,90,.06);margin-bottom:14px}
button{font:inherit;border:0;border-radius:14px;padding:13px 18px;background:var(--pri);color:#fff;font-weight:600;width:100%;margin-top:8px}
button.ghost{background:#e9eefc;color:var(--pri)}
button:disabled{opacity:.4}
/* Step 0 */
.locrow{display:flex;gap:12px;align-items:center}
.locicon{font-size:30px}
.inst{display:flex;gap:14px;align-items:center}
.insticon{font-size:46px;width:70px;height:70px;border-radius:18px;background:#eef2fb;display:flex;align-items:center;justify-content:center}
.zchips{display:flex;flex-wrap:wrap;gap:6px}
.zc{padding:7px 12px;border-radius:999px;background:#eef1f8;font-size:13px}
.zc.sel{background:var(--pri);color:#fff}
/* 播放器 */
.player{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:#f1f4fa}
button.pbtn{width:46px;height:46px;border-radius:50%;padding:0;margin:0;flex:none;display:flex;align-items:center;justify-content:center}
.pbtn svg{width:22px;height:22px;fill:#fff}
.pinfo{flex:1;min-width:0}
.pinfo b{font-size:14px}
.pinfo small{display:block;font-size:11px;color:var(--sub);margin-top:4px}
.pbar{height:4px;border-radius:2px;background:#dde3f0;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--pri)}
/* 视频 */
.vbox{position:relative;height:290px;border-radius:16px;background:#1d2433;overflow:hidden}
.vbox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
.vph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px}
.guide{position:absolute;left:50%;top:46%;width:150px;height:200px;transform:translate(-50%,-50%);border:2px dashed #ffffff88;border-radius:50%;pointer-events:none;display:none}
.vtip{position:absolute;left:0;right:0;bottom:0;padding:9px;text-align:center;font-size:13px;color:#fff;background:#000a}
.bar{height:4px;background:#ffffff33;position:absolute;left:0;top:0;right:0}
.bar i{display:block;height:100%;width:0;background:#7cf;transition:width .2s}
/* 舞台：植物是悬浮的实体，不带土壤 */
.stage{height:230px;position:relative;border-radius:16px;overflow:hidden;display:flex;justify-content:center;align-items:center}
.pw{height:100%;width:74%;transform-origin:50% 50%}
.pw svg{display:block;width:100%;height:100%;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:.4}to{transform:scale(1);opacity:1}}
.fx-crazy .pw{animation:willow .7s ease-in-out infinite alternate}
@keyframes willow{from{transform:rotate(-14deg) translateX(-6px)}to{transform:rotate(14deg) translateX(6px)}}
.fx-luck .pw{animation:boom 1.1s ease-in-out infinite}
@keyframes boom{50%{transform:scale(1.1)}}
.fx-wave .pw{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{from{transform:translateY(8px) rotate(-5deg)}to{transform:translateY(-18px) rotate(5deg)}}
.fx-tired .pw{animation:droop 3.2s ease-in-out infinite}
@keyframes droop{0%,100%{transform:rotate(16deg) translateY(14px) scale(.95)}50%{transform:rotate(19deg) translateY(20px) scale(.93)}}
.fx-brick .pw{animation:labor .26s ease-in-out infinite alternate}
@keyframes labor{from{transform:translateY(0)}to{transform:translateY(7px) scaleY(.95)}}
.fxi span{position:absolute;bottom:30px;font-size:24px;animation:fup 2.2s ease-out infinite;opacity:0}
@keyframes fup{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
/* 色块 */
.blocks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bw{text-align:center}
.blk{width:100%;aspect-ratio:1;border-radius:14px;border:3px solid #3d3d3d;transition:transform .15s}
.blk.sel{transform:scale(1.1);box-shadow:0 0 0 3px #3b6cf6,0 6px 14px #0003}
.blkname{font-size:13px;margin-top:6px;font-weight:600}
.blkname small{font-weight:400;font-size:10px;color:var(--sub)}
/* 强度 */
.notes{display:flex;gap:6px;margin:12px 0 4px}
.notes div{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:#eef1f8;font-size:13px;font-weight:600}
.notes div.on{background:var(--pri);color:#fff}
.notes small{display:block;font-weight:400;font-size:10px;opacity:.8}
input[type=range]{width:100%;margin:10px 0}
.thumbs{display:flex;gap:4px}
.thumbs div{flex:1;border-radius:8px;background:#e7ecf5;border:2px solid transparent;padding:2px}
.thumbs div.on{border-color:var(--pri);background:#dfe8ff}
.thumbs svg{width:100%;height:52px;display:block}
.thumbs small{display:block;text-align:center;font-size:9px;color:var(--sub)}
/* 特殊状态 */
.sp{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{width:calc(33.3% - 6px);text-align:center;padding:10px 2px;border-radius:14px;background:#eef1f8;font-size:14px;font-weight:600}
.chip small{display:block;font-weight:400;font-size:10px;color:var(--sub);margin-top:2px}
.chip.sel{background:var(--pri);color:#fff}.chip.sel small{color:#dfe7ff}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}
svg text{font-size:10px;fill:#7a8aa0}
.pin{position:absolute;font-size:24px;transition:all 1.2s cubic-bezier(.4,0,.2,1)}
.mapwrap{position:relative}
.small{font-size:12px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.5}
/* 摄像头页：地点小按钮 + 转盘 */
button.zpill{width:auto;margin:0 0 10px;padding:7px 14px;border-radius:999px;background:#eef1f8;color:var(--ink);font-size:13px;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:sheetup .25s ease-out}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.wheel{position:relative;height:220px;margin:8px 0 4px}
.wheel-band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:#eef2fb;pointer-events:none}
.wheel-list{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wheel-list::-webkit-scrollbar{display:none}
.wheel-list i{display:block;height:88px}
.wheel-list .wi{height:44px;line-height:44px;text-align:center;font-size:18px;font-weight:600;scroll-snap-align:center;cursor:pointer}
/* Step 2：情绪圆圈（emoji 挨在一起，拖动时互相挤压） */
.efwrap{margin:4px 0 8px}
.ef{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:#000;overflow:hidden;touch-action:none;box-shadow:0 0 0 5px #1d2433,0 6px 18px #0004;cursor:grab;user-select:none;-webkit-user-select:none}
.ef:active{cursor:grabbing}
.em{position:absolute;left:50%;top:50%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffffff1a;opacity:.4;transition:opacity .25s,box-shadow .25s,background .25s;will-change:transform;pointer-events:none}
.em.sel{opacity:1;background:#ffffff2e;box-shadow:0 0 0 3px var(--c),0 0 18px var(--c)}
.einfo{display:flex;gap:14px;align-items:center}
.etx{flex:1;min-width:0}
.eword{display:flex;align-items:center;gap:8px;font-size:30px;line-height:1.1}
.eword b{font-size:20px}
.dots{display:flex;gap:4px;margin:8px 0 6px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--pri)}
.elv{font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================
 * 1. 配置：情绪 ↔ 植物 ↔ 音阶 / 乐器 ↔ 地点 / 特殊状态
 *    颜色取自设计稿色块。改这里即可调整设计。
 * ===================================================== */
const EMOS = [
  {id:'angry',     name:'愤怒', en:'angry',      color:'#dd6037', plant:'chili',    scale:[0,1,3,5,7,8,10],  reg:0,  tempo:300,  vel:1.15, rest:0,
   stages:['种子','发芽','幼苗','小青椒','青椒','转红','红椒']},
  {id:'optimistic',name:'乐观', en:'optimistic', color:'#f5c16a', plant:'corn',     scale:[0,2,4,6,7,9,11],  reg:0,  tempo:380,  vel:1,    rest:0,
   stages:['种子','发芽','幼苗','幼穗','壮穗','露粒','成熟']},
  {id:'calm',      name:'平静', en:'calm',       color:'#ffffff', plant:'mushroom', scale:[0,2,5,7,9,12,14], reg:0,  tempo:950,  vel:.8,   rest:.3,
   stages:['孢子','菌丝','菌点','幼菇','成长','伞展','成熟']},
  {id:'miserable', name:'痛苦', en:'miserable',  color:'#94b1c9', plant:'eggplant', scale:[0,2,3,5,7,8,10],  reg:-1, tempo:1000, vel:.85,  rest:.15,
   stages:['种子','发芽','幼苗','开花','幼果','膨大','成熟']},
  {id:'relaxed',   name:'放松', en:'relaxed',    color:'#a6af7f', plant:'cabbage',  scale:[0,2,4,7,9,12,16], reg:0,  tempo:700,  vel:.85,  rest:.15,
   stages:['种子','发芽','幼苗','莲座','卷心','结球','成熟']},
];
const SOLFEGE = ['do','re','mi','fa','sol','la','si'];
const BLIP = true;        // Step 4 拖动强度时，空闲状态下是否发一个单音作为反馈

// 乐器（音色用 WebAudio 合成；oct = 该乐器的音区偏移，单位：八度）
const INSTR = {
  piano:  {name:'钢琴',  icon:'🎹', oct:0,  mono:false},
  flute:  {name:'长笛',  icon:'🪈', oct:1,  mono:true},
  guitar: {name:'吉他',  icon:'🎸', oct:-1, mono:false},
  marimba:{name:'马林巴',icon:'🎶', oct:0,  mono:false},
  trumpet:{name:'小号',  icon:'🎺', oct:0,  mono:true},
  harp:   {name:'竖琴',  icon:'🎼', oct:0,  mono:false},
};
// 地点 → 乐器（理由不展示给用户）。lat/lng/r 待填校园实测坐标（r 单位：米）；box 为地图上的位置序号
const ZONES = [
  {id:'class',  name:'教学楼', inst:'flute',   lat:null, lng:null, r:60},
  {id:'library',name:'图书馆', inst:'piano',   lat:null, lng:null, r:50},
  {id:'dorm',   name:'宿舍',   inst:'guitar',  lat:null, lng:null, r:60},
  {id:'canteen',name:'食堂',   inst:'marimba', lat:null, lng:null, r:50},
  {id:'field',  name:'操场',   inst:'trumpet', lat:null, lng:null, r:80},
  {id:'garden', name:'菜地',   inst:'harp',    lat:null, lng:null, r:40},
];
const zoneOf = id => ZONES.find(z=>z.id===id);
const zoneIdx = id => ZONES.findIndex(z=>z.id===id);

// 特殊状态：状态 — 音乐手法 — 情绪色彩（参考手绘图）
const SPECIALS = [
  {id:'crazy',name:'发疯',  sub:'打人柳',  tech:'颤音',  emo:'恐惧',     icon:'🤪'},
  {id:'luck', name:'接好运',sub:'爆果丰收',tech:'滑音',  emo:'惊喜',     icon:'🍀'},
  {id:'wave', name:'浪',    sub:'',        tech:'跳音',  emo:'欢快',     icon:'🏄'},
  {id:'tired',name:'疲惫',  sub:'',        tech:'延长音',emo:'平静/悲伤',icon:'😴'},
  {id:'brick',name:'搬砖',  sub:'',        tech:'连弹',  emo:'急促',     icon:'🧱'},
];
const FXICONS = {crazy:['💢','🌀','💢'],luck:['✨','🍀','✨'],wave:['🎶','🕶️','🎶'],tired:['💤','💤','💤'],brick:['🧱','💦','🧱']};
const emoOf = id => EMOS.find(e=>e.id===id);
const EXPR_CN  = {happy:'高兴',surprised:'惊讶',angry:'生气',disgusted:'厌恶',fearful:'害怕',sad:'难过',neutral:'平静'};
const NEUTRAL_DAMP = 0.6;

/* =====================================================
 * 1b. 情绪地图（Mood Meter）：42 个 emoji = 5 类情绪里的细分情绪
 *     col/row 是 6×6 心情格里的位置：col 左→右＝不愉快→愉快，row 上→下＝高能量→低能量。
 *     四个象限各归一类：左上 愤怒(辣椒) / 右上 乐观(玉米) / 左下 痛苦(茄子) / 右下 放松(卷心菜)；
 *     平静(蘑菇)是正中间的一小簇。强度＝离中心的距离：越靠外圈越强（1–7 级，对应生长阶段和音阶）。
 *     想换 emoji、改名字、挪位置，改下面这张表即可。
 * ===================================================== */
const PLANTNAME = {chili:'辣椒',corn:'玉米',mushroom:'蘑菇',eggplant:'茄子',cabbage:'卷心菜'};
const MOOD_RAW = [
  // [类别, emoji, 中文, English, col, row]   平静簇：最后一项是它在中心簇里的序号（0 = 正中）
  ['angry','🤬','暴怒','Enraged',1,1],['angry','😖','紧绷','Stressed',2,1],['angry','😱','震惊','Shocked',3,1],
  ['angry','😤','气冲冲','Fuming',1,2],['angry','😠','愤怒','Angry',2,2],['angry','😬','躁动','Restless',3,2],
  ['angry','🤮','反感','Repulsed',1,3],['angry','😟','担心','Worried',2,3],['angry','😕','不安','Uneasy',3,3],
  ['optimistic','😲','惊讶','Surprised',4,1],['optimistic','🥳','欢庆','Festive',5,1],['optimistic','🤩','狂喜','Ecstatic',6,1],
  ['optimistic','😁','活力满满','Energized',4,2],['optimistic','😄','乐观','Optimistic',5,2],['optimistic','😆','兴奋','Excited',6,2],
  ['optimistic','🙂','愉快','Pleasant',4,3],['optimistic','🤗','满怀希望','Hopeful',5,3],['optimistic','🥰','幸福','Blissful',6,3],
  ['miserable','🤢','厌恶','Disgusted',1,4],['miserable','🙁','低落','Down',2,4],['miserable','🫥','冷淡','Apathetic',3,4],
  ['miserable','😢','痛苦','Miserable',1,5],['miserable','😔','孤独','Lonely',2,5],['miserable','🥱','疲倦','Tired',3,5],
  ['miserable','😭','绝望','Despair',1,6],['miserable','😥','凄凉','Desolate',2,6],['miserable','😩','精疲力竭','Drained',3,6],
  ['relaxed','☺️','自在','At ease',4,4],['relaxed','😊','满足','Content',5,4],['relaxed','😇','充实','Fulfilled',6,4],
  ['relaxed','😌','放松','Relaxed',4,5],['relaxed','🫠','安歇','Restful',5,5],['relaxed','😚','平衡','Balanced',6,5],
  ['relaxed','😴','困倦','Sleepy',4,6],['relaxed','😪','宁静','Tranquil',5,6],['relaxed','😶‍🌫️','安详','Serene',6,6],
  ['calm','😐','平静','Calm',0],['calm','😑','淡然','Neutral',1],['calm','😶','安静','Quiet',2],
  ['calm','😮‍💨','松一口气','Exhale',3],['calm','🤔','沉思','Pensive',4],['calm','🧐','专注','Focused',5],
];
const CALM_POS = [[0,0],[0,-.92],[.875,-.284],[.54,.744],[-.54,.744],[-.875,-.284]];   // 平静簇：中心 + 一圈 5 个
const MOOD_GAP = {x:.75, y:.78, py:.95};   // 四个象限向外让出的空隙（给中间的平静簇）与行距；单位＝一个 emoji 的直径
const MOODS = MOOD_RAW.map(([cat,e,zh,en,c,r])=>{
  let x,y;
  if(cat==='calm'){[x,y]=CALM_POS[c]}
  else{x=(c-3.5)+Math.sign(c-3.5)*MOOD_GAP.x; y=(r-3.5)*MOOD_GAP.py+Math.sign(r-3.5)*MOOD_GAP.y}
  return {cat,e,zh,en,x,y};
});
const MOOD_RMAX = Math.max(...MOODS.map(m=>Math.hypot(m.x,m.y)));
// 强度：离中心越远越强，1–7 级（平静簇只有 1–2 级）
MOODS.forEach(m=>{m.level=Math.max(1,Math.min(7,1+Math.round(Math.hypot(m.x,m.y)/MOOD_RMAX*6)))});
const moodOf = e => MOODS.find(m=>m.e===e);
// 摄像头给出 5 类之后，再按原始表情的强弱，在这一类里猜一个最贴近的 emoji
function guessEmoji(cat,a){
  const g=k=>a[k]||0;
  if(cat==='angry'){
    const f=g('fearful'),d=g('disgusted'),an=g('angry');
    if(f>=an&&f>=d) return f>.55?'😱':'😟';
    if(d>=an) return d>.55?'🤮':'😬';
    if(g('sad')>.2) return '😖';
    return an>.8?'🤬':an>.55?'😤':'😠';
  }
  if(cat==='optimistic'){
    const h=g('happy'),su=g('surprised');
    if(su>.35&&h>.35) return '🤩';
    if(su>h) return '😲';
    return h>.9?'😆':h>.7?'😁':h>.45?'😄':'🙂';
  }
  if(cat==='miserable'){const sd=g('sad');return sd>.85?'😭':sd>.6?'😢':sd>.4?'😔':'🙁'}
  if(cat==='relaxed'){const h=g('happy');return h>.3?'😊':h>.15?'☺️':'😌'}
  if(g('angry')>.1) return '🧐';
  if(g('surprised')>.1) return '🤔';
  if(g('sad')>.1) return '😮‍💨';
  return '😐';
}

/* =====================================================
 * 2. 植物 SVG：5 种植物 × 7 阶段，只画种子 / 苗 / 果实实体，不画土壤
 *    viewBox 200×220，实体大致居中
 * ===================================================== */
let UID=0, DEFS='';
const grad=(a,b,t='v')=>{
  const id='g'+(UID++);
  DEFS+= t==='r'
    ? `<radialGradient id="${id}" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`
    : `<linearGradient id="${id}" x1="0" y1="0" x2="${t==='h'?1:0}" y2="${t==='h'?0:1}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
  return `url(#${id})`;
};
const G=(dy,b)=>`<g transform="translate(0 ${dy})">${b}</g>`;
const stemP=(d,c,w)=>`<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
const leaf=(x,y,r,l,c='#4caf50',wd=.35)=>`<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0 0 C${l*.25} ${-l*wd},${l*.75} ${-l*wd},${l} 0 C${l*.75} ${l*wd},${l*.25} ${l*wd},0 0Z" fill="${c}" stroke="#00000022" stroke-width="1"/><path d="M2 0 L${l*.85} 0" stroke="#ffffff66" stroke-width="1.2"/></g>`;
const roots=(x,y,n=5,len=22,c='#d8c8a0')=>{

/* =====================================================
 * 3. 位置识别 → 乐器
 *    优先级：URL 参数 ?zone=library（二维码/NFC 现场贴码）→ GPS 地理围栏 → 手动选择
 * ===================================================== */
function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function locate(){
  const zu=ZONES.find(z=>z.id===new URLSearchParams(location.search).get('zone'));
  if(zu) return zu;
  const cfg=ZONES.filter(z=>z.lat!=null);
  if(!cfg.length) throw new Error('NOCFG');
  if(!navigator.geolocation) throw new Error('NOGEO');
  const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:10000,maximumAge:30000}));
  let best=null,bd=1e9;
  cfg.forEach(z=>{const d=haversine(pos.coords.latitude,pos.coords.longitude,z.lat,z.lng);if(d<z.r&&d<bd){best=z;bd=d}});
  if(!best) throw new Error('OUT');
  return best;
}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script '+src));document.head.appendChild(s)})}
let faceReady=null;

  if(faceReady) return faceReady;
  faceReady=(async()=>{
    const q=new URLSearchParams(location.search);
    const libs=['./vendor/face-api.js','https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js','https://unpkg.com/@vladmandic/face-api/dist/face-api.js'];
    const bases=['./vendor/model/','https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/','https://unpkg.com/@vladmandic/face-api/model/'];
    if(q.get('lib')) libs.unshift(q.get('lib'));
    if(q.get('models')) bases.unshift(q.get('models'));
    if(!window.faceapi){let ok=false;for(const l of libs){try{await loadScript(l);ok=true;break}catch(e){}} if(!ok) throw new Error('LIB')}
    try{await faceapi.tf.setBackend('webgl')}catch(e){await faceapi.tf.setBackend('cpu')}
    await faceapi.tf.ready();

function aggregate(a){

  const agg={
    angry:(a.angry||0)+(a.disgusted||0)+(a.fearful||0)*.7,   // 害怕＝高能量·不愉快，和愤怒同在左上象限
    optimistic:h*hs+(a.surprised||0)*.6,
    calm:n*(1-sm),
    miserable:(a.sad||0),
    relaxed:n*sm+h*(1-hs),
  };
  const tot=Object.values(agg).reduce((x,y)=>x+y,0)||1;
  const top=Object.entries(agg).sort((x,y)=>y[1]-x[1])[0];
  return {emotion:top[0],confidence:+(top[1]/tot).toFixed(2),emoji:guessEmoji(top[0],a)};
}

  const e=S.emotion&&emoOf(S.emotion),m=S.emoji&&moodOf(S.emoji);let h=prog();
  if(S.step===1){
    h+=`<h1>此刻的你</h1><div class="hint">Step 1 · 摄像头识别面部表情（本机运算，视频不上传）。识别约 3.5 秒。</div>
    <div class="card"><button class="zpill" id="b-zone" aria-label="调整地点">📍 <span id="zname">${zoneOf(S.zone).name}</span> · 调整</button>
    <div class="vbox"><video id="cam" playsinline muted autoplay></video><div class="vph" id="vph">📷</div><div class="guide" id="guide"></div><div class="bar"><i id="bar"></i></div><div class="vtip" id="vtip">点击下方按钮开始</div></div>
    <button id="b-detect">开启摄像头并识别</button>
    ${DEBUG?`<button class="ghost" id="b-sim">模拟识别（调试）</button><button class="ghost" id="b-manual">跳过，直接选表情</button>`:''}</div>`;
  }
  if(S.step===2){
    const g=S.guess&&moodOf(S.guess);
    h+=`<h1>此刻是哪种感觉？</h1><div class="hint">Step 2 · 拖动圆圈，找最贴近的表情，点一下选中。越靠外圈，强度越大。</div>
    <div class="efwrap"><div class="ef" id="ef"></div></div>
    <div class="small" style="margin:0 0 12px">${g?`摄像头猜测：${g.e} ${g.zh}${S.confidence?` · 置信度 ${Math.round(S.confidence*100)}%`:''}`:'手动选择'}</div>
    <div class="card"><div class="einfo"><div class="stage" id="pstage" style="height:130px;width:130px;flex:none"><div class="pw" id="pw" style="width:84%"></div></div>
      <div class="etx"><div class="eword"><span id="ee"></span><b id="ezh"></b></div><small id="een" class="small" style="display:block;text-align:left;margin:2px 0 0"></small>
      <div class="dots" id="dots"></div><div class="elv" id="elv"></div><small id="ecat" class="small" style="display:block;text-align:left;margin:2px 0 0"></small></div></div>
      ${playerHTML()}</div>
    <button id="b-next" disabled>就是它，下一步</button><button class="ghost" id="b-back">返回</button>`;
  }
  if(S.step===3){
    const cur=SPECIALS.find(x=>x.id===S.special);
    h+=`<h1>要加点特殊状态吗？</h1><div class="hint">Step 3 · 可选，不添加也行；再点一次取消。叠加在当前植物和音乐上</div>
    <div class="card">${stageHTML(S.level)}
    <div class="sp">${SPECIALS.map(s=>`<div class="chip ${S.special===s.id?'sel':''}" data-sp="${s.id}">${s.icon} ${s.name}<small>${s.sub?s.sub+' · ':''}${s.tech}</small></div>`).join('')}</div>
    <div class="small">${cur?`${spName(S.special)}：音乐用「${cur.tech}」表现，情绪色彩偏「${cur.emo}」`:'未添加特殊状态'}</div>${playerHTML()}</div>
    <button id="b-next">${S.special?'添加并继续':'跳过，继续'}</button><button class="ghost" id="b-back">返回</button>`;
  }
  if(S.step===4){
    h+=`<h1>确认并保存</h1><div class="hint">Step 4 · 确认后，动画定位到校园地图</div>
    <div class="card"><div class="stage" style="height:150px;margin-bottom:8px;background:radial-gradient(circle at 50% 52%,${e.color}aa 0%,#e8edf5 82%)"><div class="pw" style="width:50%">${plantSVG(S.emotion,S.level)}</div></div>
      <div class="kv"><span>情绪</span><b>${m?`${m.e} ${m.zh} · ${m.en}`:e.name}</b></div>
      <div class="kv"><span>归类</span><b>${e.name} · ${PLANTNAME[e.plant]}</b></div>
      <div class="kv"><span>强度</span><b>${S.level}级 · ${SOLFEGE[S.level-1]}</b></div>
      <div class="kv"><span>生长阶段</span><b>${e.stages[S.level-1]}</b></div>
      <div class="kv"><span>特殊状态</span><b>${spName(S.special)}</b></div>
      <div class="kv"><span>乐器</span><b>${instOf().icon} ${instOf().name}</b></div>
      <div class="kv"><span>时间</span><b>${new Date().toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</b></div></div>
    <button id="b-save">确认并保存，种进校园地图</button><button class="ghost" id="b-back">返回修改</button>`;
  }
  if(S.step===5){
    h=`<h1>校园菜地</h1><div class="hint">你的这一株已种在你所在的位置。其他同学的植物为本地模拟数据。</div>
    <div class="card"><div class="mapwrap" id="mapwrap">${mapSVG(true)}<div class="pin" id="pin">📍</div></div><div class="small" id="mapmsg">定位中…</div><div class="small" id="syncmsg"></div></div>
    <button id="b-again">再记录一次</button>`;
  }
  $app.innerHTML=h;bind();syncPlayer();
}

/* 校园地图：6 个地点各有一块种植区（4×3 格）；植物放在记录发生的地点 */
const MOCK=[['library','calm',5],['library','relaxed',3],['class','optimistic',7],['class','angry',4],['dorm','miserable',6],['dorm','relaxed',7],['canteen','optimistic',5],['canteen','calm',2],['field','angry',7],['field','optimistic',6],['garden','relaxed',4],['garden','miserable',3]].map(([zone,emotion,level])=>({zone,emotion,level,peer:true}));
const zonePos=i=>({x:10+(i%3)*110,y:14+Math.floor(i/3)*140});
const slotXY=(zi,k)=>{const p=zonePos(zi),c=k%4,r=Math.floor(k/4)%3;return{x:p.x+12.5+c*25,y:p.y+36+r*28}};
const entriesOf=(zid,recs)=>MOCK.filter(m=>m.zone===zid).concat(recs.filter(r=>(r.zone||'garden')===zid));
function mapSVG(skipLast,hl){
  const all=load(),recs=skipLast?all.slice(0,-1):all;
  let s=`<svg viewBox="0 0 340 290" width="100%"><rect width="340" height="290" rx="12" fill="#eef3ea"/><path d="M0 137 H340 M110 0 V290 M220 0 V290" stroke="#fff" stroke-width="10"/>`;
  ZONES.forEach((z,zi)=>{
    const p=zonePos(zi);
    s+=`<rect x="${p.x}" y="${p.y}" width="100" height="112" rx="10" fill="${z.id==='garden'?'#d3e8c8':'#e2e9f4'}" ${hl===z.id?'stroke="#3b6cf6" stroke-width="2.5"':''}/><text x="${p.x+8}" y="${p.y+13}">${z.name}</text>`;
    for(let k=0;k<12;k++){const c=slotXY(zi,k);s+=`<rect x="${c.x-11}" y="${c.y-13}" width="22" height="26" rx="5" fill="#ffffff88"/>`}
    const kk=.12;
    entriesOf(z.id,recs).slice(-12).forEach((r,i)=>{const c=slotXY(zi,i);s+=`<g transform="translate(${c.x-100*kk} ${c.y-110*kk}) scale(${kk})" ${r.peer?'opacity=".9"':''}>${drawPlant(r.emotion,r.level)}</g>`});
  });
  return s+'</svg>';
}
function animateMap(){
  const wrap=document.getElementById('mapwrap'),pin=document.getElementById('pin');
  const all=load(),last=all[all.length-1],zid=last.zone||'garden',zi=zoneIdx(zid);
  const list=entriesOf(zid,all),k=(list.length-1)%12,p=slotXY(zi,k),w=wrap.clientWidth,r=w/340;
  wrap.querySelector('svg').outerHTML=mapSVG(true);
  pin.style.left=(w*.5-12)+'px';pin.style.top='-10px';pin.style.opacity=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{pin.style.opacity=1;pin.style.left=(p.x*r-12)+'px';pin.style.top=(p.y*r-30)+'px'}));
  setTimeout(()=>{wrap.querySelector('svg').outerHTML=mapSVG(false,zid);pin.style.opacity=0;
    const m=document.getElementById('mapmsg');if(m)m.textContent=`已种在「${zoneOf(zid).name}」· 共 ${all.length} 株属于你`},1400);
}

/* =====================================================
 * 8. 事件绑定
 * ===================================================== */
/* ---- Step 2：情绪圆圈 ----
 * 每个 emoji 是一个小圆，有"家"（地图位置）和当前位置；家 = 地图位置 + 整体平移。
 * 拖动时整体平移立刻跟手，每个 emoji 用弹簧追赶自己的家（靠近手指的追得更紧、各自快慢略有不同），
 * 于是前后会挤在一起，再由"圆与圆不重叠"的碰撞把它们推开，松手后弹回。离窗口中心越远越小（鱼眼）。*/
function initField(){
  const ef=document.getElementById('ef');if(!ef)return;
  const W=ef.clientWidth||340,R=W/2,D=W*.2,KB=.13,DAMP=.72;
  const items=MOODS.map((m,i)=>{
    const el=document.createElement('div');el.className='em';el.textContent=m.e;
    el.style.cssText=`width:${D}px;height:${D}px;font-size:${D*.62}px;line-height:${D}px;--c:${emoOf(m.cat).color}`;
    ef.appendChild(el);
    return {m,el,hx:m.x*D,hy:m.y*D,x:(Math.random()-.5)*3,y:(Math.random()-.5)*3,vx:0,vy:0,k:KB*(.8+.4*((i*37%11)/10)),s:1,sel:false};
  });
  const cur=S.emoji&&items.find(t=>t.m.e===S.emoji);
  if(cur){cur.sel=true;cur.el.classList.add('sel')}
  // 平移范围：最外圈的 emoji 能拖到窗口里，但不会让圆圈里大半是空白
  const limX=Math.max(...items.map(t=>Math.abs(t.hx)))-1.6*D,limY=Math.max(...items.map(t=>Math.abs(t.hy)))-1.6*D;
  const lim=(v,l)=>Math.max(-l,Math.min(l,v));
  const pan={x:cur?lim(-cur.hx,limX):0,y:cur?lim(-cur.hy,limY):0},pv={x:0,y:0};
  const clampPan=()=>{pan.x=lim(pan.x,limX);pan.y=lim(pan.y,limY)};
  let tween=null,drag=null;
  function pick(t){
    if(!t)return;
    items.forEach(o=>{o.sel=o===t;o.el.classList.toggle('sel',o===t)});
    S.emoji=t.m.e;S.emotion=t.m.cat;S.level=t.m.level;
    tween={x:lim(-t.hx,limX),y:lim(-t.hy,limY)};refreshInfo();paramChanged(true);
  }
  const rel=ev=>{const r=ef.getBoundingClientRect();return{x:ev.clientX-r.left-r.width/2,y:ev.clientY-r.top-r.height/2}};
  ef.addEventListener('pointerdown',ev=>{
    try{ef.setPointerCapture(ev.pointerId)}catch(e){}
    const p=rel(ev);drag={id:ev.pointerId,x0:ev.clientX,y0:ev.clientY,lx:ev.clientX,ly:ev.clientY,t0:performance.now(),moved:0,fx:p.x,fy:p.y};
    tween=null;pv.x=pv.y=0;
  });
  ef.addEventListener('pointermove',ev=>{
    if(!drag||ev.pointerId!==drag.id)return;
    const dx=ev.clientX-drag.lx,dy=ev.clientY-drag.ly,p=rel(ev);
    drag.lx=ev.clientX;drag.ly=ev.clientY;drag.fx=p.x;drag.fy=p.y;
    drag.moved=Math.max(drag.moved,Math.hypot(ev.clientX-drag.x0,ev.clientY-drag.y0));
    pan.x+=dx;pan.y+=dy;pv.x=pv.x*.5+dx*.5;pv.y=pv.y*.5+dy*.5;clampPan();
  });
  ef.addEventListener('pointerup',ev=>{
    if(!drag||ev.pointerId!==drag.id)return;
    const d=drag;drag=null;
    if(d.moved<8&&performance.now()-d.t0<600){               // 轻点＝选中最近的 emoji
      let best=null,bd=1e9;
      items.forEach(t=>{const dd=Math.hypot(d.fx-t.x,d.fy-t.y);if(dd<D*.5*Math.max(t.s,.6)&&dd<bd){best=t;bd=dd}});
      pick(best);
    }
  });
  ef.addEventListener('pointercancel',()=>{drag=null});
  (function tick(){
    if(!ef.isConnected)return;
    if(!drag){
      if(tween){pan.x+=(tween.x-pan.x)*.14;pan.y+=(tween.y-pan.y)*.14;if(Math.hypot(tween.x-pan.x,tween.y-pan.y)<.5)tween=null}
      else{pan.x+=pv.x;pan.y+=pv.y;pv.x*=.93;pv.y*=.93;clampPan()}
    }
    for(const t of items){
      let k=t.k;if(drag)k*=1+1.4*Math.exp(-((Math.hypot(drag.fx-t.x,drag.fy-t.y)/D)**2)/3);
      t.vx=(t.vx+(t.hx+pan.x-t.x)*k)*DAMP;t.vy=(t.vy+(t.hy+pan.y-t.y)*k)*DAMP;t.x+=t.vx;t.y+=t.vy;
    }
    const MIN=D*.94;
    for(let pass=0;pass<2;pass++)for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
      const a=items[i],b=items[j];let dx=b.x-a.x,dy=b.y-a.y;const dd=Math.hypot(dx,dy);
      if(dd>=MIN)continue;
      if(dd<.01){dx=Math.random()-.5;dy=Math.random()-.5}
      const d2=Math.hypot(dx,dy)||1,nx=dx/d2,ny=dy/d2,o=(MIN-dd)/2*.6;
      a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;                 // 互相靠近时交换一点速度（碰撞弹开）
      if(rv<0){const j2=rv*.45;a.vx+=nx*j2;a.vy+=ny*j2;b.vx-=nx*j2;b.vy-=ny*j2}
    }
    for(const t of items){
      const d=Math.hypot(t.x,t.y)/R,s=Math.max(.3,1.1-.8*d*d);t.s=s;
      t.el.style.transform=`translate(${t.x-D/2}px,${t.y-D/2}px) scale(${t.sel?s*1.15:s})`;
      t.el.style.zIndex=Math.round(s*100)+(t.sel?200:0);
    }
    requestAnimationFrame(tick);
  })();
}
// Step 2 下方信息：选中的 emoji、归类、强度（离中心的距离）、对应的蔬菜生长阶段
function refreshInfo(){
  const $=id=>document.getElementById(id);if(!$('ee'))return;
  const m=S.emoji&&moodOf(S.emoji);
  if($('b-next'))$('b-next').disabled=!m;
  if(!m){$('ee').textContent='🌱';$('ezh').textContent='还没有选';$('een').textContent='点圆圈里的表情';$('elv').textContent='';$('dots').innerHTML='';$('ecat').textContent='';$('pw').innerHTML='';return}
  const e=emoOf(m.cat);
  $('ee').textContent=m.e;$('ezh').textContent=m.zh;$('een').textContent=m.en;
  $('elv').textContent=`${m.level}级 · ${SOLFEGE[m.level-1]} · ${e.stages[m.level-1]}`;
  $('dots').innerHTML=[1,2,3,4,5,6,7].map(i=>`<i class="${i<=m.level?'on':''}"></i>`).join('');
  $('ecat').textContent=`归入：${e.name} · ${PLANTNAME[e.plant]}`;
  $('pstage').style.background=`radial-gradient(circle at 50% 52%,${e.color}aa 0%,#e8edf5 82%)`;
  $('pw').innerHTML=plantSVG(m.cat,m.level);
}

function bind(){
  const $=id=>document.getElementById(id);
  $('b-back')&&($('b-back').onclick=()=>go(S.step-1));
  $('b-next')&&($('b-next').onclick=()=>go(S.step+1));
  $('pbtn')&&($('pbtn').onclick=()=>Audio_.toggle(pParams()));
  if(S.step===1){
    loadFaceModels().catch(()=>{});
    $('b-detect').onclick=runCamera;$('b-zone').onclick=openZoneWheel;
    $('b-sim')&&($('b-sim').onclick=simulate);
    $('b-manual')&&($('b-manual').onclick=()=>{S.emotion=null;S.confidence=null;S.emoji=null;S.guess=null;S.level=1;go(2)});
  }
  if(S.step===2){initField();refreshInfo()}
  if(S.step===3) document.querySelectorAll('[data-sp]').forEach(el=>el.onclick=()=>{
    S.special=(S.special===el.dataset.sp)?null:el.dataset.sp;paramChanged(false);render();
  });
  if(S.step===4) $('b-save').onclick=()=>{
    const r=load();r.push({t:Date.now(),zone:S.zone,emotion:S.emotion,emoji:S.emoji,level:S.level,special:S.special,conf:S.confidence});save(r);
    enqueue();go(5);animateMap();flushQueue();
  };
  if(S.step===5) $('b-again').onclick=reset;
}

/* =====================================================
 * 9. 同步到电脑（方案 E）：待发队列 + 失败自动重试
 *    默认发给"提供本页面的那台电脑"（同源 /api/record）。
 *    页面托管在别处（如 GitHub Pages）时，用 ?api=https://电脑地址 指定一次，之后会记住。
 *    注意：只上传文字记录，摄像头视频从不保存、不上传，识别完画面即丢弃。
 * ===================================================== */
const QKEY='emotion-garden-queue', AKEY='emotion-garden-api';
const apiBase=()=>{
  const q=new URLSearchParams(location.search).get('api');
  if(q!==null){try{localStorage.setItem(AKEY,q.replace(/\/+$/,''))}catch(e){}}
  try{return localStorage.getItem(AKEY)||''}catch(e){return ''}
};
const qLoad=()=>{try{return JSON.parse(localStorage.getItem(QKEY))||[]}catch(e){return []}};
const qSave=q=>{try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}};
function enqueue(){
  const e=emoOf(S.emotion),z=S.zone&&zoneOf(S.zone),ins=instOf();
  const q=qLoad();
  q.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    client_time:new Date().toISOString(),
    zone:z?z.name:'', emotion:e.name, emoji:S.emoji||'', word:S.emoji?moodOf(S.emoji).zh+' '+moodOf(S.emoji).en:'', level:S.level, solfege:SOLFEGE[S.level-1],
    stage:e.stages[S.level-1], special:S.special?spName(S.special):'',
    instrument:ins.name, confidence:S.confidence==null?'':S.confidence
  });
  qSave(q);
}
let flushing=false;
async function flushQueue(){
  if(flushing)return;flushing=true;
  try{
    let q=qLoad();
    while(q.length){
      const r=await fetch(apiBase()+'/api/record',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q[0])});
      if(!r.ok)throw new Error('HTTP '+r.status);
      q=qLoad();q.shift();qSave(q);   // 发送成功才出队
    }
  }catch(err){console.warn('同步失败，稍后重试',err)}
  flushing=false;showSync();
}
function showSync(){
  const el=document.getElementById('syncmsg');if(!el)return;
  const n=qLoad().length;
  el.textContent=n?`⏳ 有 ${n} 条记录待同步到电脑（网络恢复后自动重发）`:'✅ 已同步到电脑';
}
window.addEventListener('online',flushQueue);
setInterval(()=>{if(qLoad().length)flushQueue()},15000);
apiBase();flushQueue();
render();
</script>
